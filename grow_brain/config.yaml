name: Grow Brain
version: "0.4.3"
slug: grow_brain
description: Fully automated grow tent controller with a Claude-powered grow advisor. Pairs with the GrowOp iPhone app.
url: https://github.com/dsdadsasdaaaaaaaa/gro-op
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
homeassistant_api: true
hassio_api: false
host_network: false
watchdog: http://[HOST]:[PORT:8099]/api/health
ingress: true
ingress_port: 8099
panel_icon: mdi:sprout
panel_title: Grow Brain
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: HTTP API used by the GrowOp iPhone app
options:
  api_key: ""
  anthropic_api_key: ""
  model: claude-opus-5
  timezone: ""
  log_level: info
schema:
  api_key: str?
  anthropic_api_key: password?
  model: str?
  timezone: str?
  log_level: list(debug|info|warning|error)?
