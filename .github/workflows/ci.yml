name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  addon:
    name: Grow Brain tests + Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r grow_brain/requirements.txt pytest pytest-asyncio
      - name: Tests
        run: cd grow_brain && python -m pytest -q
      - name: Build the add-on image exactly as the Supervisor does
        run: docker build grow_brain
